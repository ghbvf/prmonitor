[package]
name = "prmonitor"
version = "0.1.0"
description = "Desktop app that monitors GitHub PRs and streams codex pr-review via codex app-server"
authors = ["ghbvf"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prmonitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.39"
# `rt` (current-thread runtime) is for the AB#1044 CLI client path: `prmonitor review …` builds
# its own `tokio::runtime` to drive the `reqwest` trigger/poll BEFORE any Tauri (and its runtime)
# exists. The GUI path keeps using `tauri::async_runtime`.
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "process", "io-util", "net"] }
# Local webhook receiver (#9): a single `POST /webhook` endpoint bound to
# 127.0.0.1, reached from the public internet via a Cloudflare Quick Tunnel
# (`cloudflared` subprocess). axum is the idiomatic tokio HTTP server — its async
# handler calls the same `auto_dispatch` path the scheduler uses with zero
# sync→async bridging. `json` feature is unused (we read the raw body via the
# `Bytes` extractor to HMAC-verify the GitHub `X-Hub-Signature-256` before parsing).
axum = { version = "0.7", default-features = false, features = ["tokio", "http1"] }
# GitHub webhook HMAC-SHA256 signature verification (`X-Hub-Signature-256`).
# `hmac::Mac::verify_slice` is constant-time. `hex` decodes the `sha256=<hex>` header.
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
aes = "0.8"
cbc = "0.1"
# Azure DevOps Service Hooks carry no body HMAC (AB#822); they authenticate via a
# user-configured `Authorization: Bearer <webhookSecret>` header. `subtle::ConstantTimeEq`
# is the constant-time compare for that token (the GitHub path's analogue of
# `hmac::Mac::verify_slice`), so the secret can't leak its content through a timing side-channel.
subtle = "2"
# `future::join_all` drives the auto-trigger dispatcher's unbounded concurrent
# `start_review` calls in a single task. The engines hold `&` borrows of the
# resident `CodexManager`/`SessionRegistry` (neither `Clone`), so spawning each
# review would require `'static` owned handles; `join_all` over borrowing futures
# keeps the shared-borrow design. Only `futures` (no extra runtime) is pulled.
futures = "0.3"
# Realtime stream bus (AB#1072 / #1373): `tokio_stream::wrappers::BroadcastStream` adapts the
# `StreamBus`'s `tokio::sync::broadcast` receiver into a `Stream` the local-api SSE endpoint maps
# to axum `Sse` events. `sync` is the only feature needed (the broadcast/watch stream wrappers);
# `default-features = false` drops the unused `time` wrapper.
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
# Unified local SQLite store (#70): the single persistence backend for config /
# tracked PRs / dispatch ledger / review sessions + history / webhook PRs. `bundled`
# compiles a pinned libsqlite3 from source (no system sqlite dependency), and the
# synchronous `rusqlite` API fits the existing "sync store behind a std Mutex" pattern
# (registry/ledger) — the pump's async path calls these sub-millisecond sync writes
# directly without holding the connection lock across an `.await`.
rusqlite = { version = "0.32", features = ["bundled"] }
# Outbound HTTP client for the Bitbucket Server/DC REST API source (AB#717) — the
# first outbound HTTP dependency (gh/az are CLI subprocesses; axum is the INBOUND
# webhook server). `rustls-tls` avoids a system OpenSSL build dependency (pure-Rust
# TLS, consistent with rusqlite's `bundled`); `json` deserializes paginated PR pages.
# `default-features = false` drops the default native-tls stack. Reuses the existing
# tokio runtime (async reqwest), mirroring how gh/az run on tokio::process.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Parse RFC-compliant HTTP-date `Retry-After` values for notification webhook backoff.
httpdate = "1"
# SMTP email notification adapter (AB#1459). Use tokio + rustls instead of native-tls/OpenSSL.
lettre = { version = "0.11.22", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls-tls", "rustls-platform-verifier"] }
# CLI subcommand (`prmonitor review …`, AB#1044): `clap` parses the review args, then the same
# binary acts as a thin HTTP client over the AB#1043 local API (reusing the resident `reqwest`).
clap = { version = "4", features = ["derive"] }
# Resolve the app-data dir (where `prmonitor.db` lives) from OUTSIDE a Tauri app, so the CLI
# client can read the saved local-API port/token. Matches Tauri's `app_data_dir` convention
# (platform data dir + bundle identifier); the identifier itself is golden-locked in `cli.rs`.
dirs = "5"
# Single-instance lock (AB#1044): a cold-start `prmonitor review` (app not running) becomes the
# FIRST instance, boots the GUI + local API, then triggers in-process; it also dedups GUI
# windows. Registered FIRST in the builder (before opener/store), per the ticket.
# `deep-link` feature (AB#1045): on Windows/Linux the OS hands a `prmonitor://…` deeplink to a
# NEW process as argv; the feature makes single-instance forward that argv to the running
# instance, where `tauri-plugin-deep-link`'s `on_open_url` fires — so a deeplink always reaches
# the resident app, never cold-starts a duplicate. (macOS delivers via Info.plist, not argv.)
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Deeplink scheme `prmonitor://` (AB#1045): registers the scheme (static via Info.plist on macOS,
# runtime on Windows/Linux) and surfaces opened URLs through `on_open_url`. Parsed + validated in
# `review::deeplink`, then routed into the same `trigger_review` funnel the CLI/local-API use.
tauri-plugin-deep-link = "2"
# Desktop notification (AB#1045): a deeplink-triggered review is fire-and-forget (the OS returns no
# result to the opener), so completion is surfaced as a desktop notification carrying the pr-review
# comment URL. Sent from Rust (`NotificationExt`), so no frontend capability entry is needed.
tauri-plugin-notification = "2"
# Parse the `prmonitor://review?pr=N&repo=R&kind=review` deeplink (AB#1045): `on_open_url` already
# hands us `url::Url`, so this is the same crate the plugin uses (already in the tree via reqwest);
# promoted to a direct dep so the slice-internal parser names it explicitly.
url = "2"
# Web PTY backend (#1372): the SECOND `terminal::backend::TerminalBackend` impl — a real local
# pseudo-terminal exposed to the Remote Web Console. Cross-platform (unix openpty + Windows ConPTY)
# so the same `WebPtyManager` drives mac + Windows; portable-pty wraps the platform PTY + child.
portable-pty = "0.9"
# Base64-encode raw PTY output bytes into the `terminal:event` `output { data }` wire field
# (byte-lossless — a PTY stream is not guaranteed valid UTF-8, so it is NOT `from_utf8_lossy`d).
base64 = "0.22"
# Serve the built web SPA (`dist-web`) over the terminal listener so the Remote Web Terminal is
# reachable in a browser via the tunnel (#1504). CORE derive only — NOT rust-embed's `axum` feature,
# which targets axum 0.8 and would conflict with our pinned axum 0.7; the handler builds the axum 0.7
# `Response` manually like the sibling `/invoke`+`/events` handlers. Release embeds the bundle into
# the binary (self-contained); debug reads `dist-web/` from disk (live-reload). `mime_guess` maps the
# asset extension to `Content-Type`.
rust-embed = "8"
mime_guess = "2"

# Pin: brotli 8.0.3 (pulled transitively by tauri-codegen/tauri-utils) requires
# alloc-no-stdlib "^2.0", but alloc-stdlib/brotli-decompressor accept ">=2.0.4,<4"
# so Cargo greedily picks alloc-no-stdlib 3.0.0 for them, leaving two versions in
# the graph and breaking brotli's Allocator trait bounds. Forcing 2.0.4 unifies
# them (all three accept it). Remove once brotli's dep closure is consistent again.
alloc-no-stdlib = "=2.0.4"

[dev-dependencies]
# A real multi-thread runtime + `test-util` (paused time) for the scheduler
# `#[tokio::test]` lifecycle tests, which spawn `run_loop` and drive it through
# wake/reconfigure/stop deterministically (no sleeps).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "test-util", "io-util"] }
# `test` feature exposes `tauri::test::{mock_app, MockRuntime}` for the AB#1225 listener
# supervisor reconcile integration test, which builds a mock app handle and drives a real
# loopback bind→serve→teardown cycle (the unit tests cover the pure paths). CI-safe: 127.0.0.1 only.
tauri = { version = "2", features = ["test"] }
ts-rs = "12.0.1"
strum = { version = "0.28.0", features = ["derive"] }
