# forge.conf — single source for the ACTIVE forge + per-forge constants.
#
# Sourced by forge.sh. Secrets (PAT / tokens) come from the ENVIRONMENT, never
# from this file:
#   github -> GH_TOKEN / gh auth
#   azure  -> AZURE_DEVOPS_EXT_PAT   (Code R/W + Work Items R/W; Build for pipeline management)
#   gitlab -> GITLAB_TOKEN / glab auth
#
# Active forge: the PRMONITOR_FORGE env var overrides DEFAULT_FORGE below.
DEFAULT_FORGE="azure"

# Protocol constant (forge-neutral): the pm:* comment marker that — together with
# per-forge author trust — gates the dispatch trust boundary (pr-meta F3). Single
# source; every backend's pr-comments-json references it.
PM_COMMENT_MARKER_RE='<!-- pm:(ship|fix|pr-review|ci|oos) -->'

# --- github (alternative backend; dormant) ------------------------------------
# Remote: https://github.com/ghbvf/prmonitor
# Trust = GitHub author_association (OWNER/MEMBER/COLLABORATOR), resolved in
# forge/github.sh; no static allowlist needed for a single-owner repo.
GITHUB_REPO_SLUG="ghbvf/prmonitor"
GITHUB_REMOTE="origin"
# GitHub backend is dormant for this repo. Keep CI off unless the repo is moved
# back to GitHub Actions.
GITHUB_HAS_CI="false"

# --- azure devops (ACTIVE) ----------------------------------------------------
# Remote: https://dev.azure.com/shengming0923/gocell/_git/prmonitor
ADO_ORG="${ADO_ORG:-https://dev.azure.com/shengming0923}"
ADO_PROJECT="${ADO_PROJECT:-gocell}"
ADO_REPO="${ADO_REPO:-prmonitor}"
AZURE_REMOTE="${AZURE_REMOTE:-azure}"
# Azure has no GitHub-style author_association. Trust = explicit allowlist of
# comment-author uniqueName/email (single-user repo => the owner identity is the
# only trusted author). Comma-separated. Resolved-empty stays fail-closed and the
# backend warns to stderr so it is never a SILENT block (F1); note `-` (not `:-`)
# means only an UNSET var uses this default — an explicitly empty env value stays
# empty and thus fail-closed (no dispatch). Edit the literal to change the default.
AZURE_TRUSTED_AUTHORS="${AZURE_TRUSTED_AUTHORS-shengming@jiangshengming.com}"
# Azure Pipelines is not wired for this repo yet. When false, ci-* verbs return
# `no-ci`; ship/fix fall back to local pnpm/cargo verification and do not post
# pm:ci.
AZURE_HAS_CI="${AZURE_HAS_CI:-false}"
# Work Item type mapping (process-template dependent). This project uses the
# SCRUM process template, whose backlog type is "Product Backlog Item" — it has
# NO "Issue" type (that's Basic/Agile), so "Issue" => VS402323. Verify the live
# type set with:
#   az devops invoke --area wit --resource workitemtypes \
#     --route-parameters project=gocell --org "$ADO_ORG" --query 'value[].name'
# Tier mapping (PROJECT.md §1.1): Epic ▷ Feature ▷ Product Backlog Item. BACKLOG
# (PBI) is the leaf (≈ one PR); EPIC / FEATURE are multi-PR containers. Pass the
# matching type as `issue-create`'s 4th arg when scripting container creation;
# leaf PBIs default to BACKLOG. EPIC/FEATURE containers are currently authored in
# the Azure Boards UI (see PROJECT.md §1.1).
AZURE_WI_TYPE_BACKLOG="Product Backlog Item"
AZURE_WI_TYPE_EPIC="Epic"
AZURE_WI_TYPE_FEATURE="Feature"
# Work Item "closed" state — Basic process: To Do / Doing / Done (NO "Closed")
# => close == Done. (Agile/CMMI use "Closed"; Scrum uses "Done".)
AZURE_WI_CLOSE_STATE="Done"

# --- gitlab (best-effort; not exhaustively selftested) ------------------------
GITLAB_REPO_SLUG="${GITLAB_REPO_SLUG:-}"
GITLAB_REMOTE="gitlab"
GITLAB_HAS_CI="true"
GITLAB_TRUSTED_AUTHORS="${GITLAB_TRUSTED_AUTHORS:-}"
