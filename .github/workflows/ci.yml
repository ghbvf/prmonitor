name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.11.0"

jobs:
  frontend:
    name: Frontend (vue-tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check release versions are consistent
        run: node scripts/check-release-version.mjs
      - name: Test release version checker
        run: node --test scripts/check-release-version.test.mjs
      - run: pnpm build
      # #1504: validate the web-terminal SPA bundle here (fast frontend job) too — not only in the
      # slower Rust job — so Vite-bundle errors surface early. Mirrors beforeBuildCommand's coverage.
      - run: pnpm run build:web
      - run: pnpm test

  rust:
    name: Rust (fmt + clippy + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Frontend dist is required by tauri-build (frontendDist points at ../dist).
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # #1504: the web SPA bundle (`dist-web`) is embedded by `remote::terminal_http` via rust-embed.
      # Must run BEFORE cargo so release embeds the real bundle (build.rs only writes a placeholder).
      - run: pnpm run build:web
      - run: pnpm run check:config-types
      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: cargo build
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  rust-platform-cli-resolution:
    name: Rust (${{ matrix.platform }} CLI resolution)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri-build requires the configured frontendDist even for the resolver unit tests.
      - run: pnpm build
      - name: cargo test (platform CLI resolver)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib config::cli
